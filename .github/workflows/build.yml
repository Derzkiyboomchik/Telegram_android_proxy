name: Build APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Go Shared Libraries (.so)
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK path: $NDK_PATH"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          
          go mod download
          
          echo "Building arm64-v8a..."
          CC="$TOOLCHAIN/aarch64-linux-android26-clang" CXX="$TOOLCHAIN/aarch64-linux-android26-clang++" \
            CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -buildmode=c-shared -ldflags="-s -w" -o app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so .
          
          echo "Building armeabi-v7a..."
          CC="$TOOLCHAIN/armv7a-linux-androideabi26-clang" CXX="$TOOLCHAIN/armv7a-linux-androideabi26-clang++" \
            CGO_ENABLED=1 GOOS=android GOARCH=arm \
            go build -buildmode=c-shared -ldflags="-s -w" -o app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so .
            
          echo "Building x86_64..."
          CC="$TOOLCHAIN/x86_64-linux-android26-clang" CXX="$TOOLCHAIN/x86_64-linux-android26-clang++" \
            CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go build -buildmode=c-shared -ldflags="-s -w" -o app/src/main/jniLibs/x86_64/libtgwsproxy.so .
            
          rm -f app/src/main/jniLibs/*/*.h
          ls -la app/src/main/jniLibs/*/*.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
